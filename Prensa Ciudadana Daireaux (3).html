<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prensa Ciudadana Daireaux</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo & Title -->
            <div class="flex items-center gap-3">
                <!-- SVG Logo Integrado -->
                <div class="w-10 h-10 rounded-xl shadow-sm flex items-center justify-center overflow-hidden bg-black dark:bg-transparent ring-1 ring-slate-900/10 dark:ring-white/10 shrink-0">
                     <svg viewBox="0 0 100 100" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                        <rect width="100" height="100" fill="black"/>
                        <path d="M 35 32 L 35 68 L 50 68 C 65 68 70 60 70 50 C 70 40 65 32 50 32 Z" fill="white"/>
                    </svg>
                </div>
                
                <div class="flex flex-col">
                    <h1 class="text-lg font-bold leading-tight tracking-tight">Prensa Ciudadana</h1>
                    <span class="text-xs font-medium text-primary-600 dark:text-primary-500 uppercase tracking-wider">Daireaux</span>
                </div>
            </div>

            <!-- Actions (Theme Toggle) -->
            <div class="flex items-center gap-2">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-400" aria-label="Cambiar tema">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block">light_mode</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6">
        
        <!-- Categories Filter -->
        <section>
            <div class="flex overflow-x-auto gap-2 pb-2 no-scrollbar" id="categoryFilterContainer">
                <button class="filter-btn active px-4 py-2 rounded-full bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 text-sm font-medium whitespace-nowrap transition-colors" data-category="Todas">
                    Todas las voces
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors" data-category="Comunidad">
                    Comunidad
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors" data-category="Campo">
                    Campo/Agronomía
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors" data-category="Deportes">
                    Deportes locales
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors" data-category="Alertas">
                    Alertas y Reclamos
                </button>
                <button class="filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors" data-category="Cultura">
                    Cultura
                </button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-20 text-slate-500">
            <span class="material-symbols-outlined animate-spin text-4xl mb-4 text-primary-500">sync</span>
            <p>Conectando con la plaza de Daireaux...</p>
        </div>

        <!-- Feed Container -->
        <section id="feedContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            <!-- Content will be injected here -->
        </section>

        <!-- Empty State (Hidden by default) -->
        <section id="emptyState" class="hidden flex flex-col items-center justify-center py-20 px-4 text-center border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl bg-white/50 dark:bg-slate-800/50">
            <!-- SVG Logo en Empty State -->
            <div class="w-24 h-24 mb-6 rounded-3xl shadow-sm flex items-center justify-center overflow-hidden bg-black ring-1 ring-slate-900/10 dark:ring-white/10 shrink-0">
                 <svg viewBox="0 0 100 100" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" fill="black"/>
                    <path d="M 35 32 L 35 68 L 50 68 C 65 68 70 60 70 50 C 70 40 65 32 50 32 Z" fill="white"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-2">La plaza está tranquila</h2>
            <p class="text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-8">
                Aún no hay publicaciones hoy. ¡Sé el primer vecino en informar a Daireaux sobre lo que está pasando!
            </p>
            <button onclick="openModal()" class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-full font-semibold shadow-md shadow-primary-500/30 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined">add_circle</span>
                Romper el hielo
            </button>
        </section>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 z-40 bg-slate-900 hover:bg-slate-800 dark:bg-primary-600 dark:hover:bg-primary-500 text-white p-4 rounded-2xl shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 flex items-center gap-2 group" aria-label="Publicar Noticia">
        <span class="material-symbols-outlined">edit_square</span>
        <span class="font-medium hidden sm:block pr-2">Publicar</span>
    </button>

    <!-- Publish Modal -->
    <div id="publishModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity duration-300">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Modal Content -->
        <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
            <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh] pointer-events-auto transform scale-95 transition-transform duration-300" id="modalCard">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-slate-100 dark:border-slate-800">
                    <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary-500">add_comment</span>
                        Nueva Publicación
                    </h3>
                    <button onclick="closeModal()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <!-- Modal Body (Form) -->
                <div class="p-6 overflow-y-auto custom-scrollbar">
                    <form id="publishForm" class="space-y-5">
                        <!-- Title -->
                        <div>
                            <label for="postTitle" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Título de la noticia/reclamo</label>
                            <input type="text" id="postTitle" required placeholder="Ej: Baches en calle Urquiza" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400">
                        </div>

                        <!-- Category -->
                        <div>
                            <label for="postCategory" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Categoría</label>
                            <select id="postCategory" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all appearance-none">
                                <option value="" disabled selected>Selecciona una categoría...</option>
                                <option value="Comunidad">Comunidad / Eventos</option>
                                <option value="Campo">Campo / Agronomía</option>
                                <option value="Deportes">Deportes Locales</option>
                                <option value="Alertas">Alertas / Reclamos Vecinales</option>
                                <option value="Cultura">Cultura</option>
                            </select>
                        </div>

                        <!-- Content -->
                        <div>
                            <label for="postContent" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">¿Qué está pasando en Daireaux?</label>
                            <textarea id="postContent" required rows="4" placeholder="Describe los detalles para informar a los vecinos..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all resize-none placeholder:text-slate-400"></textarea>
                        </div>

                        <!-- Optional Image URL -->
                        <div>
                            <label for="postImage" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Enlace a imagen (Opcional)</label>
                            <input type="url" id="postImage" placeholder="https://ejemplo.com/foto.jpg" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all placeholder:text-slate-400 text-sm">
                        </div>
                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="p-6 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" form="publishForm" id="submitBtn" class="px-5 py-2.5 rounded-xl font-medium bg-primary-600 hover:bg-primary-700 text-white shadow-md shadow-primary-500/20 transition-all flex items-center gap-2">
                        <span>Publicar a la comunidad</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none flex items-center gap-2">
        <span class="material-symbols-outlined text-green-400 text-xl" id="toastIcon">check_circle</span>
        <span id="toastMessage" class="text-sm font-medium">Publicación exitosa</span>
    </div>

    <!-- LÓGICA DE NUBE (FIREBASE) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // TUS CREDENCIALES REALES DE FIREBASE (YA CONFIGURADAS)
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDSzs6BXDQczrceCyHnVWsy9dSL967vLi4",
            authDomain: "prensa-ciudadana-daireaux.firebaseapp.com",
            projectId: "prensa-ciudadana-daireaux",
            storageBucket: "prensa-ciudadana-daireaux.firebasestorage.app",
            messagingSenderId: "850733826907",
            appId: "1:850733826907:web:0f826ca84771745498107e",
            measurementId: "G-3L5LSCZHSD"
        };
        // =====================================================================

        let postsData = [];
        let currentCategory = 'Todas';
        let isSaving = false;

        const ui = {
            feedContainer: document.getElementById('feedContainer'),
            emptyState: document.getElementById('emptyState'),
            loadingState: document.getElementById('loadingState'),
            publishModal: document.getElementById('publishModal'),
            modalCard: document.getElementById('modalCard'),
            publishForm: document.getElementById('publishForm'),
            submitBtn: document.getElementById('submitBtn'),
            filterBtns: document.querySelectorAll('.filter-btn'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage')
        };

        let db;
        let auth;

        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            } catch (error) {
                console.error("Error al cargar Firebase:", error);
            }

            // Hacemos el inicio de sesión opcional para evitar que rompa la página si falla
            try {
                await signInAnonymously(auth);
                console.log("Vecino autenticado silenciosamente.");
            } catch (e) {
                console.warn("Inicio de sesión falló. Usando modo público sin registrar usuario.");
            }
            
            // Siempre intentamos leer la base de datos
            setupRealtimeListener();
        }

        // LECTURA EN TIEMPO REAL DESDE LA NUBE
        function setupRealtimeListener() {
            try {
                const postsRef = collection(db, 'daireaux_news'); 
                const q = query(postsRef, orderBy('createdAt', 'desc')); 

                onSnapshot(q, (snapshot) => {
                    postsData = [];
                    snapshot.forEach((doc) => {
                        postsData.push({ id: doc.id, ...doc.data() });
                    });
                    
                    ui.loadingState.classList.add('hidden');
                    renderFeed();
                }, (error) => {
                    console.error("Error leyendo noticias:", error);
                    // Si da error al leer, mostramos el empty state para que no quede cargando infinito
                    ui.loadingState.classList.add('hidden');
                    ui.emptyState.classList.remove('hidden');
                });
            } catch (e) {
                ui.loadingState.classList.add('hidden');
                ui.emptyState.classList.remove('hidden');
            }
        }

        // GUARDADO (ESCRITURA) HACIA LA NUBE
        ui.publishForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSaving) return;

            const title = document.getElementById('postTitle').value.trim();
            const category = document.getElementById('postCategory').value;
            const content = document.getElementById('postContent').value.trim();
            const imageUrl = document.getElementById('postImage').value.trim();

            isSaving = true;
            ui.submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Publicando...`;
            ui.submitBtn.disabled = true;

            try {
                const postsRef = collection(db, 'daireaux_news');
                
                // Conseguir ID seguro aunque falle la autenticación
                let safeUserId = "vecino_anonimo";
                if (auth && auth.currentUser) {
                    safeUserId = auth.currentUser.uid;
                }
                
                await addDoc(postsRef, {
                    title: title,
                    category: category,
                    content: content,
                    imageUrl: imageUrl || null,
                    authorId: safeUserId, // Seguro a prueba de fallos
                    createdAt: serverTimestamp() 
                });
                
                closeModal();
                ui.publishForm.reset();
                showToast("¡Noticia enviada a la nube de Daireaux!");
                
                if(currentCategory !== 'Todas' && currentCategory !== category) {
                    setCategory('Todas');
                }

            } catch (error) {
                console.error("Error al guardar:", error);
                // Si esto falla, es 100% seguro que las Reglas de Firebase siguen en "false"
                showToast("Falta activar las Reglas de Firebase (true)", true);
            } finally {
                isSaving = false;
                ui.submitBtn.innerHTML = `<span>Publicar a la comunidad</span>`;
                ui.submitBtn.disabled = false;
            }
        });

        // ==========================================
        // Funciones Visuales (Render y UI)
        // ==========================================
        function renderFeed() {
            ui.feedContainer.innerHTML = ''; 
            
            const filteredPosts = currentCategory === 'Todas' 
                ? postsData 
                : postsData.filter(post => post.category === currentCategory);

            if (filteredPosts.length === 0) {
                ui.feedContainer.classList.add('hidden');
                ui.emptyState.classList.remove('hidden');
            } else {
                ui.emptyState.classList.add('hidden');
                ui.feedContainer.classList.remove('hidden');
                
                filteredPosts.forEach(post => {
                    const card = createPostCard(post);
                    ui.feedContainer.appendChild(card);
                });
            }
        }

        function createPostCard(post) {
            let dateObj = new Date();
            if (post.createdAt && post.createdAt.toDate) {
                dateObj = post.createdAt.toDate();
            } else if (post.createdAt) {
                dateObj = new Date(post.createdAt);
            }
            const formattedDate = dateObj.toLocaleDateString('es-AR', { day: 'numeric', month: 'long', hour: '2-digit', minute:'2-digit' });
            
            const badgeColors = {
                'Comunidad': 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300',
                'Campo': 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300',
                'Deportes': 'bg-orange-100 text-orange-800 dark:bg-orange-900/30 dark:text-orange-300',
                'Alertas': 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300',
                'Cultura': 'bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300'
            };
            const badgeClass = badgeColors[post.category] || 'bg-slate-100 text-slate-800';
            const iconMap = {
                'Comunidad': 'groups', 'Campo': 'agriculture', 'Deportes': 'sports_soccer', 'Alertas': 'warning', 'Cultura': 'palette'
            };
            const catIcon = iconMap[post.category] || 'newspaper';

            const article = document.createElement('article');
            article.className = 'bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700/50 flex flex-col gap-4 transition-transform hover:shadow-md hover:-translate-y-1';
            
            let imageHtml = '';
            if (post.imageUrl) {
                imageHtml = `
                    <div class="relative h-48 -mx-6 -mt-6 mb-2 overflow-hidden rounded-t-3xl">
                        <img src="${post.imageUrl}" alt="${post.title}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                    </div>
                `;
            }

            article.innerHTML = `
                ${imageHtml}
                <div class="flex items-center justify-between gap-2">
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                        <span class="material-symbols-outlined text-[14px]">${catIcon}</span>
                        ${post.category}
                    </span>
                    <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">schedule</span>
                        ${formattedDate}
                    </span>
                </div>
                
                <h3 class="text-xl font-bold leading-snug text-slate-900 dark:text-white mt-1">
                    ${escapeHTML(post.title)}
                </h3>
                
                <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed flex-1 whitespace-pre-wrap">
                    ${escapeHTML(post.content)}
                </p>
                
                <div class="pt-4 mt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between text-slate-500 dark:text-slate-400">
                    <div class="flex items-center gap-2 text-xs">
                        <div class="w-6 h-6 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center">
                            <span class="material-symbols-outlined text-[14px]">person</span>
                        </div>
                        <span>Vecino Anónimo</span>
                    </div>
                    <button class="flex items-center gap-1 hover:text-primary-600 dark:hover:text-primary-400 transition-colors" title="Compartir">
                        <span class="material-symbols-outlined text-[18px]">share</span>
                    </button>
                </div>
            `;
            return article;
        }

        ui.filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const category = e.target.closest('button').dataset.category;
                setCategory(category);
            });
        });

        function setCategory(category) {
            currentCategory = category;
            ui.filterBtns.forEach(b => {
                if (b.dataset.category === category) {
                    b.className = "filter-btn active px-4 py-2 rounded-full bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 text-sm font-medium whitespace-nowrap transition-colors";
                } else {
                    b.className = "filter-btn px-4 py-2 rounded-full bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-700 text-sm font-medium whitespace-nowrap transition-colors";
                }
            });
            renderFeed();
        }

        window.openModal = function() {
            ui.publishModal.classList.remove('hidden');
            setTimeout(() => {
                ui.publishModal.classList.remove('opacity-0');
                ui.modalCard.classList.remove('scale-95');
            }, 10);
        };

        window.closeModal = function() {
            ui.publishModal.classList.add('opacity-0');
            ui.modalCard.classList.add('scale-95');
            setTimeout(() => {
                ui.publishModal.classList.add('hidden');
            }, 300);
        };

        function showToast(msg, isError = false) {
            ui.toastMessage.textContent = msg;
            ui.toast.querySelector('#toastIcon').textContent = isError ? 'error' : 'check_circle';
            ui.toast.querySelector('#toastIcon').className = `material-symbols-outlined text-xl ${isError ? 'text-red-400' : 'text-green-400'}`;
            
            ui.toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            ui.toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                ui.toast.classList.remove('opacity-100', 'translate-y-0');
                ui.toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
            }, 3000);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // Tema Oscuro/Claro
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlEl = document.documentElement;
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlEl.classList.add('dark');
        } else {
            htmlEl.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            localStorage.theme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
        });

        // Iniciar App
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
